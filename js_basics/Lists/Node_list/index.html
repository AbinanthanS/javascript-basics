<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node_List</title>
    <style>
        .btn{
            font-size: 4rem;
            margin: 10px;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            background-color: skyblue;
            color: white;
        }
    </style>
</head>
<body>
    <button class ="btn">Button 1</button><br>
    <button class ="btn">Button 2</button><br>
    <button class ="btn">Button 3</button><br>
    <button class ="btn">Button 4</button>






    <script>
/*
NodeList -> static collections of HTML elements by (id,class,element)
            can be created by using querySelectorAll()
            similar to an array,but no (map,filter,reduce)
            NodeList won't update to automatically reflect changes
*/

let buttons = document.querySelectorAll(".btn");

//add HTML/CSS properties

//buttons.forEach(button => { button.style.backgroundColor = "green"; });

//CLICK event Listener

    button.addEventListener("click",event => {
        event.target.style.backgroundColor = "tomato";
    
    });
    button.addEventListener("mouseover",event => {
        event.target.style.backgroundColor = "green";
    });

  
});
*/

//ADD AN ELEMENT
/*
let newbtn = document.createElement("button");   // step 1
newbtn.textContent = "Button 5";                 // step 2
newbtn.classList = "btn"; //applies css properties

//we need to manually add new button for nodelist

*/
//Remove an element

buttons.forEach(button => {
    button.addEventListener("click",event => {
        event.target.remove();
        buttons = document.querySelectorAll(".btn");
        console.log(buttons);
    });
});




    </script>
</body>
</html>
