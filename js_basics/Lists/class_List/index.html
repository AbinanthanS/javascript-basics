<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class_List</title>
    <style>
        /*#myh1{
            font-size: 5rem;
        }*/
        .mybtn{              /*for example 2(#id) and 3(.class) same*/
            font-size: 4rem;
            margin: 10px;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            background-color: skyblue;
            color: white;
        }
        .enabled{
            background-color: blue;
            color: aliceblue;
        }
        .hover{
            box-shadow: 0 0 10px;
            font-weight: bold;
        }
        .disabled{
            background-color: rgb(174, 221, 105);
            color: aliceblue;
        }
    </style>
</head>
<body>

<!--
example 2:

<h1 id = "myh1">Hello</h1>
<button id = "mybtn">My Button</button>
-->
 
<button class = "mybtn">Button 1</button><br>
<button class = "mybtn">Button 2</button><br>
<button class = "mybtn">Button 3</button><br>
<button class = "mybtn">Button 4</button>







    <Script>
/*
classlist - element property in javascript used to interact with an element's
            lsit of classes (CSS classes) 
            Allows you to make reusable classes for many elements
            across your webpage

> add()
> remove()
> toggle(Remove if present,Add if not)

example 1:------------------------------------------------------------------
const mybutton = document.getElementById("mybtn");
mybutton.addEventListener("mouseover",event => {
    event.target.classList.add("hover");      //toggle instead of add works same
});
mybutton.addEventListener("mouseout",event => {
    event.target.classList.remove("hover");    //toggle instead of remove works same
});
--------------------------------------------------------------------------
example 2:----------------------------------------------------------------
const myh1 = document.getElementById("myh1");
const mybutton = document.getElementById("mybtn");
myh1.classList.add("enabled");
mybutton.classList.add("enabled");

myh1.addEventListener("click",event => {

if (event.target.classList.contains("disabled")){
    event.target.textContent += ":)";
}else{
    event.target.classList.replace("enabled","disabled");
}
});

mybutton.addEventListener("click",event => {

    if (event.target.classList.contains("disabled")){
        event.target.textContent += ":)";
    }else{
        event.target.classList.replace("enabled","disabled");
    }
});

--------------------------------------------------------------------------
> replace(oldClass, newClass)
> contain() 

*/
//example 3:
let buttons = document.querySelectorAll(".mybtn");

buttons.forEach(button => {
button.classList.add("enabled");
});
buttons.forEach(button => {
button.addEventListener("mouseover",event => {
    event.target.classList.toggle("hover");
});
});
buttons.forEach(button => {
button.addEventListener("mouseout",event => {
    event.target.classList.toggle("hover");
});
});
buttons.forEach(button => {
button.addEventListener("click",event => {
    if (event.target.classList.contains("disabled")){
        event.target.textContent += ":)";
    }else{
        event.target.classList.replace("enabled","disabled");
    }
    
});
});

    </Script>
</body>
</html>
